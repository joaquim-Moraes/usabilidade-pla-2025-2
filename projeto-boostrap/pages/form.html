<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/projeto-boostrap/css/bootstrap.min.css">
    <title>Formulario</title>
</head>
<body class="container py-5">
    <h2>Exemplo de Formulario</h2>
    <form>
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" class="form-control" id="name" placeholder="seu@gmail.com">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Senha:</label>
            <input type="password" class="form-control" id="name" placeholder="**********">
        </div>

        <button class="btn btn-primary">Enviar</button>
        </form>
    
</body>
</html>
